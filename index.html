<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisrinu - Software Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo" id="logo"></div>
            <button class="menu-toggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav>
                <a href="#home">Home</a>
                <a href="#experience">Experience</a>
                <a href="#projects">Projects</a>
                <a href="#education">Education</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <div class="social-strip">
        <a href="#" target="_blank" class="social-link" id="linkedin-strip">
            <i class="fab fa-linkedin"></i>
        </a>
        <a href="#" target="_blank" class="social-link" id="github-strip">
            <i class="fab fa-github"></i>
        </a>
        <a href="#" target="_blank" class="social-link" id="instagram-strip">
            <i class="fab fa-instagram"></i>
        </a>
    </div>
    

    <section id="home" class="banner">
        <div class="banner-content">
            <h1></h1>
            <div class="dynamic-text">
                <span class="typed-text"></span><span id="static-title"></span>
            </div>
            <!-- <div class="banner-social">
                <a href="#" target="_blank" id="linkedin-banner">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
                <a href="#" target="_blank" id="github-banner">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </div> -->
        </div>
    </section>

    <section id="experience">
        <div class="section-content">
            <h2 class="section-title">Experience</h2>
            <div id="experience-container"></div>
        </div>
    </section>

    <section id="projects">
        <div class="section-content">
            <h2 class="section-title">Projects</h2>
            <div class="project-grid" id="projects-container"></div>
        </div>
    </section>

    <section id="education">
        <div class="section-content">
            <h2 class="section-title">Education</h2>
            <div class="education-grid" id="education-container"></div>
        </div>
    </section>

    <section id="about">
        <div class="section-content">
            <h2 class="section-title">About Me</h2>
            <div id="about-container" class="experience-card"></div>
        </div>
    </section>

    <section id="contact">
        <div class="section-content">
            <h2 class="section-title">Contact Me</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name=""message" rows="5" placeholder="Your message" required></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 Saisrinu. All rights reserved.</p>
    </footer>

    <button id="backToTop" class="back-to-top">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
    </button>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
